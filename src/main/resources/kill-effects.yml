# ============================================================================
# Kill effects — paid cosmetic burst played at the victim's death position when
# the killer has one selected. ALL effects below (other than "none") require
# VIP+; they never affect gameplay.
#
# Shape: one of ring | helix | column | sphere | burst | none
#   ring   — expanding horizontal ring
#   helix  — vertical spiral twisting upward
#   column — straight particle column
#   sphere — filled shell of particles
#   burst  — single one-shot explosion (ignores duration/radius expansion)
#   none   — sound + initial burst only
#
# particle: Bukkit Particle enum name (1.21+).
# sound:    Bukkit Sound enum name, or leave blank for no sound.
# icon:     Bukkit Material for the GUI icon.
# radius:   shape radius in blocks.
# duration: animation length in ticks (20 = 1s).
# volume/pitch: sound parameters.
#
# Add or edit entries freely; the GUI pages through them automatically.
# ============================================================================

