# Cosmetic arrow trail effects selectable via /arrowfx.
effects:
  none:
    display-name: "<gray>None"
    particle: null
  flame:
    display-name: "<gold>Flame"
    particle: FLAME
    particles-per-tick: 1
  crit:
    display-name: "<yellow>Critical"
    particle: CRIT
    particles-per-tick: 1
  soul:
    display-name: "<aqua>Soul"
    particle: SOUL_FIRE_FLAME
    particles-per-tick: 1
  heart:
    display-name: "<light_purple>Heart"
    particle: HEART
    particles-per-tick: 1
  witch:
    display-name: "<dark_purple>Witch"
    particle: WITCH
    particles-per-tick: 1

default-effect: none
unlock-all-by-default: false
