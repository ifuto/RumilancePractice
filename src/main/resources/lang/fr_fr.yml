# French (core subset). Any key not present here falls back to en_us via
# LocaleService's three-tier fallback, so this file only needs the most
# player-visible strings.
welcome:
  subtitle: "<yellow>Bienvenue"
  record-tip: "<yellow>Enregistre tes combats. Les clips sont la meilleure preuve contre les tricheurs."

general:
  prefix: ""
  maintenance: "<red>L'entraînement est en maintenance."
  no-permission: "<red>Tu n'as pas la permission de faire ça."
  player-only: "<red>Seuls les joueurs peuvent utiliser cette commande."
  player-not-found: "<red>Le joueur '<target>' est introuvable."
  invalid-usage: "<red>Utilisation : <usage>"
  reload-success: "<green>Configuration rechargée avec succès."
  unknown-error: "<red>Une erreur inattendue est survenue. Contacte un administrateur."
  feature-disabled: "<red>Cette fonctionnalité est désactivée."
  loading: "<gray>Chargement, patiente..."
  mode-ranked: "ranked"
  mode-unranked: "unranked"

lobby:
  spawn-set: "<green>Point d'apparition du lobby mis à jour."
  teleported: "<gray>Téléporté au lobby."

queue:
  maintenance: "<red>L'entraînement est en maintenance."
  kit-disabled: "<red>La file de ce kit est désactivée."
  cannot-join: "<red>Tu ne peux pas rejoindre une file maintenant."
  already-queued: "<red>Tu es déjà dans une file."
  high-ping: "<red>Ton ping (<ping>ms) est trop élevé pour le ranked (max <max>ms)."
  joined: "<green>Tu as rejoint la file <mode> de <yellow><kit></yellow>."
  left: "<gray>Tu as quitté la file."
  sign-full: "<red>Cette file est pleine (2/2)."
  sign-waiting: "<aqua>File <kit> | <seconds> s | <count>/<capacity>"
  waiting-bar: "<aqua>File <kit> (<platform>) | <seconds> s | <waiting> en attente"

tell:
  usage: "<gray>Utilisation :</gray> <yellow>/tell \\<player> \\<message></yellow>"
  usage-reply: "<gray>Utilisation :</gray> <yellow>/reply \\<message></yellow>"
  no-reply: "<red>Personne à qui répondre."
  offline: "<red>Joueur <target> introuvable."
  self: "<red>Impossible de vous envoyer un message à vous-même."
  to: "<gold>To <target></gold> <gray>»</gray> <white><message></white>"
  from: "<aqua>From <target></aqua> <gray>»</gray> <white><message></white>"

packpolicy:
  usage: "<gray>Utilisation :</gray> <yellow>/packpolicy [required|recommended|status]</yellow>"
  set-required: "<red>Politique du pack de ressources : OBLIGATOIRE — les joueurs qui refusent ou échouent au téléchargement sont expulsés."
  set-recommended: "<green>Politique du pack de ressources : RECOMMANDÉ — les joueurs peuvent refuser et continuer à jouer (badges texte)."
  status-required: "<gray>Politique du pack de ressources :</gray> <red>OBLIGATOIRE</red> <gray>(refus/échec = expulsion)</gray>"
  status-recommended: "<gray>Politique du pack de ressources :</gray> <green>RECOMMANDÉ</green> <gray>(refus = peut rejoindre, badges N / N+ / OWNER)</gray>"

match:
  countdown: "<yellow>Le match commence dans <seconds>..."
  found-title: "<gold><bold>Match trouvé"
  found-subtitle: "<dark_gray>· · ·"
  start-title: "<yellow><bold>⚔ START ⚔"
  win-title: "<yellow><bold>🏆 WIN 🏆"
  lose-title: "<blue><bold>LOSE"
  draw-title: "<yellow><bold>DRAW"
  timeout-draw: "<yellow>Le match a expiré et se termine par une égalité."
  ended: "<gray>Le match est terminé."
  rematch-requested: "<yellow><player> veut une revanche !"

spectator:
  now-spectating: "<gray>Tu observes <yellow><player></yellow>."
  stopped-spectating: "<gray>Tu as arrêté d'observer."
  cannot-spectate: "<red>Tu ne peux pas observer ce match maintenant."
  no-active-match: "<red><player> n'est pas en match actuellement."

settings:
  updated: "<green><key> mis à jour : <value>."
  locale-changed: "<green>Langue changée en <locale>."
  invalid-value: "<red>'<value>' n'est pas une valeur valide pour <key>."

menu:
  leave-queue: "Quitter la file"
  close: "Fermer"
  back: "Retour"

gui:
