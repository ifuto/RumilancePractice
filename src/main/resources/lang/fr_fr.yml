# Fichier de langue français. Les clés absentes ici se replient sur en_us.
general:
  prefix: "<dark_gray>[<gradient:#a855f7:#6d28d9>Rumilance</gradient><dark_gray>] </dark_gray>"
  no-permission: "<red>Vous n'avez pas la permission de faire cela."
  player-only: "<red>Seuls les joueurs peuvent utiliser cette commande."
  player-not-found: "<red>Le joueur '<target>' n'a pas été trouvé."
  invalid-usage: "<red>Utilisation : <usage>"
  reload-success: "<green>Configuration rechargée avec succès."
  unknown-error: "<red>Une erreur inattendue s'est produite. Contactez un administrateur."

duel:
  request-sent: "<gray>Demande de duel envoyée à <yellow><target></yellow>."
  request-received: "<yellow><sender></yellow> <gray>vous a défié en duel ! Tapez</gray> <green>/duel accept <sender></green> <gray>pour accepter."
  request-accepted: "<green><target></green> <gray>a accepté votre demande de duel."
  request-denied: "<red><target></red> <gray>a refusé votre demande de duel."

match:
  countdown: "<yellow>Le match commence dans <seconds>..."
  start: "<green><bold>COMBATTEZ !"
  win: "<green><bold>Vous avez gagné le match !"
  lose: "<red><bold>Vous avez perdu le match."
  draw: "<yellow><bold>Le match s'est terminé par un match nul."

kit:
  selected: "<green>Kit sélectionné : <yellow><kit></yellow>."

ranking:
  stats-header: "<gray>--- Statistiques classées : <player> (<kit>) ---"

settings:
  locale-changed: "<green>Langue changée en <locale>."

arena:
  created: "<green>Arène <arena> créée."
