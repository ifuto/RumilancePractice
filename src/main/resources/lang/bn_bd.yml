  player-only: "<red>এই কমান্ড শুধুমাত্র খেলোয়াড়রা ব্যবহার করতে পারবে।"
  player-not-found: "<red>খেলোয়াড় '<target>' পাওয়া যায়নি।"
  invalid-usage: "<red>ব্যবহার: <usage>"
  reload-success: "<green>কনফিগারেশন সফলভাবে পুনরায় লোড হয়েছে।"
