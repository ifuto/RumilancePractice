  start: "<green><bold>লড়াই শুরু!"
  win: "<green><bold>আপনি ম্যাচ জিতেছেন!"
  lose: "<red><bold>আপনি ম্যাচ হারিয়েছেন।"
  draw: "<yellow><bold>ম্যাচ ড্র হয়েছে।"

