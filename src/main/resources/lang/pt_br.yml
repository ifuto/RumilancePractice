# Arquivo de idioma em português (Brasil). Chaves ausentes usam en_us como fallback.
general:
  prefix: "<dark_gray>[<gradient:#a855f7:#6d28d9>Rumilance</gradient><dark_gray>] </dark_gray>"
  no-permission: "<red>Você não tem permissão para fazer isso."
  player-only: "<red>Apenas jogadores podem usar este comando."
  player-not-found: "<red>Jogador '<target>' não encontrado."
  invalid-usage: "<red>Uso: <usage>"
  reload-success: "<green>Configuração recarregada com sucesso."
  unknown-error: "<red>Ocorreu um erro inesperado. Contate um administrador."

duel:
  request-sent: "<gray>Pedido de duelo enviado para <yellow><target></yellow>."
  request-received: "<yellow><sender></yellow> <gray>te desafiou para um duelo! Digite</gray> <green>/duel accept <sender></green> <gray>para aceitar."
  request-accepted: "<green><target></green> <gray>aceitou seu pedido de duelo."
  request-denied: "<red><target></red> <gray>recusou seu pedido de duelo."

match:
  countdown: "<yellow>A partida começa em <seconds>..."
  start: "<green><bold>LUTE!"
  win: "<green><bold>Você venceu a partida!"
  lose: "<red><bold>Você perdeu a partida."
  draw: "<yellow><bold>A partida terminou em empate."

kit:
  selected: "<green>Kit <yellow><kit></yellow> selecionado."

ranking:
  stats-header: "<gray>--- Estatísticas Ranqueadas: <player> (<kit>) ---"

settings:
  locale-changed: "<green>Idioma alterado para <locale>."

arena:
  created: "<green>Arena <arena> criada."
