# 简体中文语言文件。此处未定义的键将回退到 en_us。
general:
  prefix: "<dark_gray>[<gradient:#a855f7:#6d28d9>Rumilance</gradient><dark_gray>] </dark_gray>"
  no-permission: "<red>你没有权限执行此操作。"
  player-only: "<red>此命令只能由玩家使用。"
  player-not-found: "<red>找不到玩家 '<target>'。"
  invalid-usage: "<red>用法：<usage>"
  reload-success: "<green>配置已成功重新加载。"
  unknown-error: "<red>发生了意外错误，请联系管理员。"

duel:
  request-sent: "<gray>已向 <yellow><target></yellow> 发送决斗请求。"
  request-received: "<yellow><sender></yellow> <gray>向你发起了决斗挑战！输入</gray> <green>/duel accept <sender></green> <gray>以接受。"
  request-accepted: "<green><target></green> <gray>接受了你的决斗请求。"
  request-denied: "<red><target></red> <gray>拒绝了你的决斗请求。"

match:
  countdown: "<yellow>比赛将在 <seconds> 秒后开始..."
  start: "<green><bold>开始战斗！"
  win: "<green><bold>你赢得了比赛！"
  lose: "<red><bold>你输掉了比赛。"
  draw: "<yellow><bold>比赛以平局结束。"

kit:
  selected: "<green>已选择套装 <yellow><kit></yellow>。"

ranking:
  stats-header: "<gray>--- 排位统计：<player> (<kit>) ---"

settings:
  locale-changed: "<green>语言已更改为 <locale>。"

arena:
  created: "<green>竞技场 <arena> 已创建。"
