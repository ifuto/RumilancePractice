# Русская локализация. Отсутствующие здесь ключи используют en_us как запасной вариант.
general:
  prefix: "<dark_gray>[<gradient:#a855f7:#6d28d9>Rumilance</gradient><dark_gray>] </dark_gray>"
  no-permission: "<red>У вас нет прав для этого действия."
  player-only: "<red>Эту команду могут использовать только игроки."
  player-not-found: "<red>Игрок '<target>' не найден."
  invalid-usage: "<red>Использование: <usage>"
  reload-success: "<green>Конфигурация успешно перезагружена."
  unknown-error: "<red>Произошла непредвиденная ошибка. Обратитесь к администратору."

duel:
  request-sent: "<gray>Запрос на дуэль отправлен <yellow><target></yellow>."
  request-received: "<yellow><sender></yellow> <gray>вызвал вас на дуэль! Введите</gray> <green>/duel accept <sender></green> <gray>чтобы принять."
  request-accepted: "<green><target></green> <gray>принял ваш запрос на дуэль."
  request-denied: "<red><target></red> <gray>отклонил ваш запрос на дуэль."

match:
  countdown: "<yellow>Матч начнётся через <seconds>..."
  start: "<green><bold>БОЙ!"
  win: "<green><bold>Вы победили в матче!"
  lose: "<red><bold>Вы проиграли матч."
  draw: "<yellow><bold>Матч завершился вничью."

kit:
  selected: "<green>Выбран набор <yellow><kit></yellow>."

ranking:
  stats-header: "<gray>--- Рейтинговая статистика: <player> (<kit>) ---"

settings:
  locale-changed: "<green>Язык изменён на <locale>."

arena:
  created: "<green>Арена <arena> создана."
