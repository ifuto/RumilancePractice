# English (UK) locale. Falls back to en_us for any key not defined here.
general:
  prefix: ""
  maintenance: "<red>Practice is currently in maintenance mode."
  no-permission: "<red>You do not have permission to do that."
  player-only: "<red>Only players can use this command."
  player-not-found: "<red>Player '<target>' could not be found."
  invalid-usage: "<red>Usage: <usage>"
  reload-success: "<green>Configuration reloaded successfully."
  unknown-error: "<red>An unexpected error occurred. Please contact an administrator."

duel:
  request-sent: "<grey>Sent a <mode> duel request (<kit>) to <yellow><target></yellow>."
  request-received: "<yellow><sender></yellow> <grey>challenged you to a <mode> duel (<kit>)."
  request-accepted: "<green><target> accepted your duel request."
  request-denied: "<red><target> declined your duel request."

ffa:
  joined: "<green>Joined the <arena> FFA arena."
  leave-hint: "<grey>Leave with </grey><yellow>/lobby</yellow>"
  left: "<grey>You left the FFA arena."
  killed-by: "<red>You were killed by <yellow><killer></yellow>."

queue:
  maintenance: "<red>Practice is currently in maintenance mode."
  kit-disabled: "<red>That kit queue is currently disabled."
  cannot-join: "<red>You cannot join a queue right now."
  already-queued: "<red>You are already in a queue."
  high-ping: "<red>Your ping (<ping>ms) is too high for ranked (max <max>ms)."
  joined: "<green>Joined the <mode> queue for <yellow><kit></yellow>."
  left: "<grey>Left the queue."

match:
  countdown: "<yellow>Match starting in <seconds>..."
  found-title: "<gold><bold>Match Found"
  found-subtitle: "<dark_gray>· · ·"
  start-title: "<yellow><bold>⚔ START ⚔"
  win-title: "<yellow><bold>🏆 WIN 🏆"
  lose-title: "<blue><bold>LOSE"
  draw-title: "<yellow><bold>DRAW"

kit:
  selected: "<green>Selected kit <yellow><kit></yellow>."

ranking:
  stats-header: "<grey>--- Ranked Stats: <player> (<kit>) ---"

settings:
  locale-changed: "<green>Language changed to <locale>."

arena:
  created: "<green>Arena <arena> created."
