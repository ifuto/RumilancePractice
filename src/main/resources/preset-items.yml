# 公式キットのプリセット編集で選べる候補。
# 推奨: 管理メニュー（ネザースター）または /kit GUI →「プリセット候補を編集」から操作。
#       自由配置・複数ページ・NBT 保持。プレイヤーは /ekit（メニューのキット）から利用。
categories:
  Armor:
    - LEATHER_HELMET
    - LEATHER_CHESTPLATE
    - LEATHER_LEGGINGS
    - LEATHER_BOOTS
    - CHAINMAIL_HELMET
    - CHAINMAIL_CHESTPLATE
    - CHAINMAIL_LEGGINGS
    - CHAINMAIL_BOOTS
    - IRON_HELMET
    - IRON_CHESTPLATE
    - IRON_LEGGINGS
    - IRON_BOOTS
    - DIAMOND_HELMET
    - DIAMOND_CHESTPLATE
    - DIAMOND_LEGGINGS
    - DIAMOND_BOOTS
    - NETHERITE_HELMET
    - NETHERITE_CHESTPLATE
    - NETHERITE_LEGGINGS
    - NETHERITE_BOOTS
  Gear:
    - WOODEN_SWORD
    - STONE_SWORD
    - IRON_SWORD
    - DIAMOND_SWORD
    - NETHERITE_SWORD
    - MACE
    - BOW
    - CROSSBOW
    - TRIDENT
    - SHIELD
    - FISHING_ROD
    - FLINT_AND_STEEL
    - WATER_BUCKET
    - LAVA_BUCKET
    - TOTEM_OF_UNDYING
  Potions:
    - speed
    - strength
    - instant_health
    - regeneration
    - fire_resistance
  Consumables:
    - GOLDEN_APPLE
    - ENCHANTED_GOLDEN_APPLE
    - ENDER_PEARL
    - ARROW
    - SNOWBALL
    - EGG
    - EXPERIENCE_BOTTLE
    - FIREWORK_ROCKET
    - COOKED_BEEF

# ─────────────────────────────────────────────────────────────────────────────
# キット別プリセット（任意）
#   プリセットはキットごとに異なる内容を設定できます。
#   kits.<キットID>.categories.<カテゴリ> を定義すると、そのキットの編集時だけ
#   グローバル categories の代わりにこの候補が使われます。
#   定義していないカテゴリはグローバルの候補にフォールバックします。
#
#   カテゴリ名: Armor / Gear / Potions / Consumables
#   （日本語キー 防具/武器/ポーション/消耗品 も可）
#   値は Material 名 / ポーションエフェクト名 / data:<base64> NBT スナップショット。
#   slots: 形式で配置スロットを明示することもできます（グローバルと同様）。
#
# 例: nodebuff キットではポーションと消耗品を独自候補にする
#
# kits:
#   nodebuff:
#     categories:
#       Potions:
#         - instant_health
#         - regeneration
#         - speed
#       Consumables:
#         - ENCHANTED_GOLDEN_APPLE
#         - ENDER_PEARL
#   boxing:
#     categories:
#       Gear:
#         slots:
#           0: IRON_SWORD
