# N Arena (plugin: NARENA) main configuration file.
# Most values here can be reloaded at runtime with /rumireload.

plugin:
  # Locale used when a player has not selected one, and as the ultimate fallback
  # when a translation key is missing from the player's own locale.
  default-locale: en_us
  # Enables verbose debug logging to the console.
  debug: false
  # When enabled, new queue/duel/FFA joins are refused with a maintenance notice.
  # Toggle at runtime with /practiceadmin maintenance <on|off>.
  maintenance: false

# Resource-pack icon glyphs rendered in front of player names (TAB list / nametags).
# The shipped pack (resourcepack/ in the repo) maps these images to unassigned
# Private-Use-Area codepoints under a custom font. Distribute the pack to players
# (e.g. Cloudflare Pages) and set require-resource-pack so the glyphs always resolve.
icons:
  # Master switch. When false no rank icons are sent (plain names, as before).
  # Only the Admin / VIP+ / VIP / PRO rank badges come from the resource pack. Team
  # identification during team fights is a plain coloured ● (no pack needed).
  enabled: true
  # Font used to render the glyphs. "default" (recommended) = render with the standard
  # game font — the resource pack merges the glyph providers into minecraft:default and
  # minecraft:uniform, so this works even on clients where custom font ids fail to
  # resolve. Set to a custom font id (e.g. "rumilance:icons", still shipped in the pack)
  # only if you know you need it.
  font: "default"
  glyphs:
    # Rank badges (placed before Admin / VIP+ / VIP / PRO names). NORM players get none.
    admin: "\uE001"
    vip: "\uE002"
    vip-plus: "\uE003"
    pro: "\uE004"

# Resource-pack distribution BY THE PLUGIN — no server.properties entries needed.
# The pack is pushed to every player shortly after joining. Policy (also switchable in
# the admin GUI, persisted to pack-policy.yml): required: true kicks players who decline
# the pack or fail to download it; required: false (recommended) lets them join anyway —
# their nametag/TAB rank badge then falls back to the text prefixes N / N+ / OWNER.
# IMPORTANT: if you previously set resource-pack= / require-resource-pack= in
# server.properties, remove those lines when this is enabled, or clients may be
# asked to apply the pack twice.
resource-pack:
  # Master switch. When false the plugin does not send any resource pack.
  #
  # The pack itself is defined in plugins/NARENA/resource-pack.json (created on first start):
  # edit its "url" by hand to point at your release asset. If the file has no url the shipped
  # Release URL below is used, and the SHA-1 is fetched from that URL on every server start
  # (then written back into the JSON) so the hash can never drift from the published zip.
  # The values here are only fallbacks for an offline server that cannot reach the URL.
  enabled: true
  # ViaVersion/ViaBackwards translate the protocol, never the resource pack: an older client
  # gets this pack byte for byte and reports it as broken/incompatible, and the custom-font
  # glyphs stay missing even when forced. Set this to the protocol number of the version the
  # pack was built for and older clients are simply not offered it (0 = offer to everyone).
  min-client-protocol: 0
  # Fallback Release URL, used only when resource-pack.json has no "url".
  url: "https://github.com/ifuto/RumilancePractice/releases/download/v1.76.52/RumilanceResourcePack.zip"
  # Fallback SHA-1 (40 hex). The live hash is what clients are actually told: it is computed
  # from the zip at the URL on every start and stored in resource-pack.json. This value only
  # covers an offline server that has never reached the URL.
  sha1: "2ad094674379fb5cc9e1f224647b9f30c26e2072"
  # true  = REQUIRED: kick players who decline the pack or fail to download it.
  # false = RECOMMENDED: they may decline and keep playing (text rank badges instead of
  #         the icon glyphs). Switchable at runtime from the admin GUI; that choice is
  #         stored in pack-policy.yml and wins over this value.
  required: false
  # Prompt shown in the client's resource-pack dialog.
  prompt: "N Arena のアイコン表示に必要なリソースパックです"
  # Kick message shown to players who declined / failed the pack.
  kick-message: "N Arena をプレイするにはリソースパックの適用が必要です。\n適用を拒否、またはダウンロードに失敗したため切断されました。"

executor:
  # Size of the async worker pool used for I/O and heavier computations
  # (database queries, schematic pastes, statistics recalculation, etc.).
  # Must be between 1 and 4 threads; defaults to 2.
  min-threads: 1
  max-threads: 4
  core-threads: 2
  keep-alive-seconds: 60

# Language handling. Each player is shown the language they chose; anyone without a choice
# follows the server default. The join-time language picker is OFF by default - the language
# simply follows the setting, and /lang still opens the picker on demand.
locale:
  picker-on-join: false

match:
  # Countdown, in seconds, before a duel/FFA match starts.
  countdown-seconds: 5
  # Maximum match duration in seconds before a draw is forced. 0 disables the limit.
  max-duration-seconds: 0
  # Number of seconds a player has to reconnect after a disconnect before forfeiting.
  reconnect-grace-seconds: 30
  # Whether to regenerate the arena (via FAWE/WorldEdit) between matches.
  regenerate-arena: true
  # Countdown after match end before players/spectators are teleported back to the lobby.
  end-teleport-delay-seconds: 5
  # TAB list grouping during a match, modelled on the TAB plugin's layout feature: a duel
  # shows "In-Game Players" + "Spectators", a party fight one column per team headed by
  # "● Red Team" / "● Blue Team" (the roster as "Name ●", fallen players as "Name ● - Death"),
  # then the spectator column. Every column is exactly 20 rows — header, blank spacer, roster,
  # then blank filler rows — because the client starts a new column on the 21st entry. The
  # header/filler rows are fake player-list entries sent to that viewer as ordinary player-info
  # packets (no packet plugin needed); real players are positioned with the 1.21.2+ list order
  # index (Paper setPlayerListOrder), which places the grid above every lobby order. While the
  # grid is shown, the viewer's list holds that grid only (lobby and other-match rows are
  # unlisted for them, and re-listed when they leave). Servers
  # running NBT-injector packet patchers (NBTAPI / Triton) are auto-detected and skip the
  # ordering to avoid kicks; set this to true/false to force it either way. When off, the TAB
  # keeps vanilla order and the players' styled list names during matches.
  tab-columns-enabled: true
  # In-match action bar content.
  #   score = the pinned scoreline (names + kills / alive counts)  [default]
  #   time  = the elapsed match time in min:sec (e.g. 04:09)
  action-bar-mode: score

queue:
  # Maximum time, in seconds, a player may wait in a ranked queue before being notified.
  max-wait-notify-seconds: 60
  # Maximum ELO difference tolerated when matching players, widened over time.
  initial-elo-range: 75
  elo-range-growth-per-interval: 25
  growth-interval-seconds: 15
  # When greater than 0, players whose ping (ms) is above this value cannot join the ranked
  # queue (they receive a warning). 0 disables the check.
  max-ranked-ping-ms: 0

ranking:
  # Display points start (rounded OpenSkill mu). Hidden Gaussian is mu=1000, sigma=250.
  starting-elo: 1000
  # Legacy Elo K-factors are unused. Ranked uses a farm-protected OpenSkill (Weng-Lin) 1v1.
  k-factor:
    # First N ranked matches (per kit) use provisional-k.
    provisional-games: 20
    provisional-k: 64
    standard-k: 32
    # Players within the top-percent-fraction of Elo (among players with >=1 ranked match) use
    # top-percent-k instead, overriding even the provisional K-factor.
    top-percent-fraction: 0.10
    top-percent-k: 26

spectator:
  allow-flight: true
  hide-from-players: true

lobby:
  world: world
  return-to-lobby-on-death: false

# Per-player sight control: world borders + send-view-distance clamp.
# Play-area walls ({@code PlayAreaWall}) slide you back along your move — they never snap to center.
# Admins (rumilance.admin) skip view-distance cap only.
sight:
  enabled: true
  # Personal WorldBorder for fighters. Spectators default OFF — vanilla WB pulls outsiders toward center.
  world-border-combatants: true
  world-border-spectators: false
  # Pearl: max blocks to search upward when fixing footing (stops glass-border rooftop teleports).
  pearl-max-lift-blocks: 2

cleanup:
  # Floating-text (hologram) sweep window after startup, in seconds. Entities load
  # asynchronously after their chunks (MC 1.17+), so the sweep listens to EntitiesLoadEvent
  # for this long and removes stray TextDisplays / hologram armor stands as chunks load in.
  # 0 = only sweep already-loaded entities; negative = keep sweeping forever.
  floating-text-window-seconds: 300

advancements:
  # Hide vanilla (minecraft:*) achievement pop-ups in practice worlds.
  #
  # KEEP THIS FALSE for bot parity. On Paper, cancelling a criterion grant
  # (PlayerAdvancementCriterionGrantEvent) also rewinds the criterion and returns out of
  # PlayerAdvancements.award BEFORE AdvancementRewards.grant runs — so the advancement's
  # experience, loot table and reward FUNCTION are all silently dropped. The Quantum pack runs
  # its hit pipeline through exactly that path (data/stats/advancement/hit.json →
  # quantum:allstats/advancestats → real_hitcd), and Fabric has no such event, so blocking
  # makes the Paper bot diverge from the reference bot on every item-switch/mace/totem flow.
  #
  # Even when enabled it never touches: non-minecraft: namespaces (all datapack advancements),
  # recipe unlocks, or any advancement that carries rewards.
  block-vanilla: false

# /testarena is only a temporary map builder; it does not replace or register /arena draft
# templates. Existing maps made with /arena draft continue to work normally.
#
# Disposable arena copies (requires FAWE/WorldEdit): every match pastes a fresh copy of the
# selected arena template at a random, chunk-aligned spot that never overlaps another live copy
# or any template's own build, and deletes the copy when the match ends. Set disposable-copies
# to false to turn automatic arena-copy generation OFF and use the existing map in place
# instead. In that mode, match.regenerate-arena=false also disables automatic FAWE restoration.
arena:
  disposable-copies: true
  # Copies are placed within +/- this many blocks of the placement centre (min 256).
  # Distance is free - copies can go arbitrarily far out: every chunk of a copy is
  # async-pregenerated and pinned with chunk tickets BEFORE players are teleported,
  # so arrival never triggers fresh chunk generation around the players.
  placement-range: 100000
  # Minimum empty margin, in blocks, kept between a copy and anything else (min 16).
  placement-spacing: 64
  # Centre of the placement band (defaults to world origin).
  placement-center-x: 0
  placement-center-z: 0

fawe:
  # Whether to attempt to use FastAsyncWorldEdit/WorldEdit for arena snapshot/restore.
  enabled: true
  # Timeout, in seconds, for a single arena regeneration operation.
  operation-timeout-seconds: 30

hooks:
  placeholderapi: true

gui:
  # How kit ids are displayed in menus when no custom display-name is set.
  # Underscores always become spaces; casing is one of:
  #   KEEP  - exactly as typed in /kit create (default: "NoDebuff" stays "NoDebuff")
  #   TITLE - capitalise each word ("No Debuff")
  #   UPPER - all caps ("NO DEBUFF")
  #   LOWER - all lowercase ("no debuff")
  kit-name-case: KEEP
  # Minimum seconds between /setting (and similar) toggle clicks per player,
  # to stop rapid ON/OFF spam from hammering the settings store.
  toggle-cooldown-seconds: 2

# Central Scoreboard/TAB — 文言・レイアウトは scoreboard.yml が正。
# ここは後方互換のフォールバック（プラグイン起動時に scoreboard.yml が無い場合の既定）。
# 通常は plugins/n-arena/scoreboard.yml を編集してください。
scoreboard:
  enabled: true
  update-interval-ticks: 20
  tab-header-footer: true
  server-name: "N Arena"
  server-ip: "play.example.com"

performance:
  # Soft cap on particles spawned per player per visual effect (region selection, arrow trails).
  particle-limit-per-player: 40

# ---------------------------------------------------------------------------------------------
# TURBO — Windows 10 システム最適化 (サーバを軽快に保つための電源管理チューニング)
# ---------------------------------------------------------------------------------------------
# ・これは Linux では何もしません。Windows 10 上で /turbo on を実行したときだけ動作します。
# ・実装はネイティブコードを使わず、Microsoft 標準ツール powercfg.exe へ委任します。
# ・/turbo on の初回に UAC (管理者権限) ダイアログが 1 回だけ表示されます。承認しないと何も変更されません。
# ・デフォルトでは現在の電源プランを書き換えず、下記のベースプランを複製した専用プランを
#   編集・有効化します。/turbo off で元のプランへ戻り、複製プランは残ります (何度 on しても増殖しません)。
# ・設定の意味:
#     proc-throttle-min-100 : プロセッサ最小状態を 100% に固定 → P-state(周波数)低下を防ぐ
#     core-parking-min-cores: 100 にするとコアパーキング(未使用コアの休止)を解除
#     utility-distribution : 0 で低負荷時も全コアへ均等分散(一部コアへの偏りを防ぐ)
#     disable-idle         : true でプロセッサ・アイドル無効化(深いC-stateを避けレイテンシ安定化)
# ・注意:
#     - disable-idle / proc-throttle-min-100 は消費電力・発熱が増えます。デスクトップ推奨、ノート/バッテリ駆動は非推奨です。
#     - 構成によっては性能が下がる場合もあるため、変更後は必ず実測 (15-20分の試合で TPS/lagspike 確認) してください。
#     - ポータブルPCや出先でバッテリ駆動する場合は off に戻す事を推奨します。
# ---------------------------------------------------------------------------------------------
turbo:
  # 複製元の電源プラン GUID。既定は Ultimate Performance (Windows 10 build 17101+ で利用可)。
  # 旧Windowsや無効化環境では複製に失敗し、変更は一切行わずに終了します。
  #   High Performance を使う場合: "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"
  #   空文字 "" にすると、複製せず現在アクティブなプランを直接編集します (自己責任・復元はできません)。
  accent-power-plan: "e9a42b02-d5df-448d-aa00-03f14749eb61"
  # プロセッサ最小状態を 100% に固定 (P-state 下限 = 定格維持)。
  proc-throttle-min-100: true
  # コアパーキング最小コア (%)。100 = 全コア駐車解除。負値 (-1) で変更しない。
  core-parking-min-cores: 100
  # ユーティリティ分散。0 = 低負荷時も全コアへ均等分散。負値 (-1) で変更しない。
  utility-distribution: 0
  # プロセッサ・アイドル無効化 (深い C-state 回避)。消費電力増のため任意。false 推奨の環境もあり。
  disable-idle: true
  # /turbo off 時に IDLEDISABLE を 0 (アイドル許可) へ戻すか。
  revert-idle-on-off: true
  # サーバープロセスのスケジューラ優先度を High に引き上げる (Windows 根幹の最大レバー)。
  # サーバーJVMは非昇格のままでも変更可能で、/turbo off で Normal へ戻ります。
  process-priority-high: true
  # Windows Defender のリアルタイムスキャンからサーバーデータフォルダ (plugins/n-arena) を
  # 除外する (チャンク書込・BOTログ・DB書込の I/O を根から軽くする)。適用前に追加分だけを
  # 記録し /turbo off で正確に除去します。既存のユーザー設定には触れません。
  defender-exclude: true
  # ターボ中はスリープ/休止/モニタ/HDD 停止を無効化 (= 複製プラン側の STANDBYIDLE 等を 0 に)。
  # 元プランへ戻すと自然に復元されます。24h稼働サーバーの突然のスリープ落ち防止。
  disable-sleep: true
  # ターボ中に停止する重いサービス (例: wuauserv)。空 "" = 停止しない。
  # 開始種別と状態を保存し /turbo off で復元します。
  stop-services: ""
#   UAC ダイアログでの承認待ち時間 (秒)。この時間内に承認されない場合は中止します。
  uac-wait-seconds: 90
  # ---------------------------------------------------------------------------
  # プレイヤー在/不在による自動切替 (「誰もいないなら休ませる」機能)
  #   - enabled: true にすると、最後のプレイヤーが抜けたら省電力化し、誰かが来たら即フルパワー復帰。
  #     /stop のようなコールドスタートはしません (サーバープロセスはずっと起動したまま)。
  #   - 省電力化の内容: (1) サーバープロセスを Windows の EcoQoS (電力スロットリング) にして
  #     CPU を後回し、(2) 電源プランを適用前の通常プランへ戻す。復帰時はその逆を即時適用。
  #   - 常駐の昇格ヘルパーが一度だけ UAC を立て、以後の自動切替ではダイアログは出ません。
  # ---------------------------------------------------------------------------
  auto:
    # 自動切替のマスタースイッチ。
    enabled: true
    # 最後のプレイヤーが抜けてから省電力化するまでの待ち時間 (秒)。0 = 即時。
    idle-delay-seconds: 0
  # ---------------------------------------------------------------------------
  # 根幹からの軽量化 (スタート・オブ・ザ・ティックの負荷分散)
  #   turbo は GC や tick そのものを直接変えることはできませんが、「各 tick の頭で
  #   重い起動処理を始める前に tick が詰まっているか」を教えることができます。
  #   これはプラグインが定期タスクの先頭で duty-cycle を自己診断するための、最大のてこです。
  #   safe-tick タグ: サーバースレッドの余裕を 4 段階でコンソールのスコアボードタグに
  #   反映します (1=余裕なし 〜 4=余裕あり)。データパック/コマンドブロックが
  #   `execute if entity @e[tag=narena.sametick.4]` のように分岐して後回し可能です。
  #   サンプリングは既存の CombatSyncListener が行った TickHealth を参照するので
  #   追加計測コストはほぼゼロ (整数比較のみ)。
  # ---------------------------------------------------------------------------
  safe-tick:
    # 負荷分散タグを有効にするか。
    enabled: true
  # ---------------------------------------------------------------------------
  # GC モード選択 (/turbo make-start が生成する start.bat のコレクタを決める)
  #   auto: マシンの実リソースから自動判定。CPU 6コア以上 かつ ヒープ14GB以上なら
  #         世代別ZGC (フルGC並行で停止 <1ms)。それ以下 — 例: 4コア8スレッド/12GB RAM
  #         に 9GB 割当 — は G1 (Aikar風) にします (ZGC は並行スレッドが CPU を食うため
  #         コアが少ないと逆効果になる、そしてメモリ使用が +15〜30% で余裕を消す)。
  #   zgc:  無条件で世代別ZGC (アップグレード後の高コア・大ヒープ向け)。
  #   g1:   無条件で G1 (現行の低リソース構成向け)。
  # ---------------------------------------------------------------------------
  jvm:
    gc-mode: auto
  # ---------------------------------------------------------------------------
  # バックグラウンド GC (「GC をバックエンドに回す」)
  #   完全な無停止はどの GC でも原理的に不可能です (回収には必ず安全点が要る)。
  #   だから狙いは「停止タイミングを自分で選ぶ」こと: 常に人がいる鯖でも瀬戸際まで
  #   溜め込まず、安く回収できる瞬間に先回りします。経路は2つ:
  #     (1) 圧力検知 [セーフティネット・常時武装]: ヒープ使用率が pressure-percent
  #         (既定85%) に達したら、人がいようがいまいが即 GC。90%超のフルGC数秒や
  #         OOM で死ぬより、85%時点の短い回収の方が遥かに安い。
  #     (2) アイドル先行回収 [暇なら先払い]: 誰もいない かつ tick 健康度が
  #         clearance-percent (既定90) 以上のときだけ、試合前にヒープを綺麗にしておく。
  #   - interval-seconds: 何秒おきに監視するか。判定はメインスレッドの軽い値読みで、
  #     実際の System.gc() はサーバーワーカースレッドで呼ぶので、停止コストは
  #     tick 予算に足されません。
  #   - min-interval-seconds: 最後の GC からこれ未満は再実行しない (連打防止)。
  #     常時高負荷でも「毎秒GC嵐」にはなりません。
  #   - pressure-percent: このヒープ使用率以上で圧力GCを発火。
  #   注意: ZGC で起動している場合はフル GC が並行なので安全にスキップします
  #   (start.bat の ZGC が有効な間は何もしません)。
  # ---------------------------------------------------------------------------
  gc-background:
    enabled: true
    interval-seconds: 5
    min-interval-seconds: 15
    clearance-percent: 90
    pressure-percent: 85

# Ping-aware combat netcode. This controls crit rewind and rubber-band/anti-void handling.
# Knockback shaping (coefficients, horizontal/vertical KB, ping-based KB sync) is NOT done
# here: install an external knockback plugin such as KnockBackSync and configure it there.
# Compensation is clamped (max 320ms) and skipped on ping spikes so lag-switches cannot
# buy extra crit rewind.
combat:
  # Random launch spread for ender pearls and wind charges, on a 0-50 scale:
  #   0  = fly perfectly straight at the crosshair (easiest for precise pearl-catching),
  #   50 = exactly vanilla random spread (throws land slightly off where aimed).
  # Values between 0 and 50 scale the vanilla random offset linearly.
  projectile-spread:
    pearl: 0
    wind-charge: 0
  ping-offset-ms: 25
  spike-threshold-ms: 20
  # Item swapping is NOT touched by this plugin any more (the old vanilla-item-swap tuning made
  # swap damage feel wrong). Swap/attribute timing is whatever your server runs with: if you want
  # the pre-1.21.4 behaviour, set unsupported-settings.update-equipment-on-player-actions: false
  # in config/paper-global.yml yourself.

# Fast TNT / creeper fuse for practice PvP.
# Only applies in active duels and FFA — lobby eggs/TNT stay vanilla.
practice-tnt:
  enabled: true
  # Vanilla primed TNT remaining fuse is 80 ticks (4s). 20 = 1 second.
  tnt-fuse-ticks: 20
  creeper-from-egg:
    enabled: true
    # Max swell ticks from spawn. Vanilla is 30; 20 = 1 second. Fuse is locked
    # (cannot cancel and walk away if thrown out of sight). Never charged.
    fuse-ticks: 20

original-kit:
  # /admin orkit close|open. When false, /originalkit is refused for non-admins.
  enabled: true

# Sitting is handled by the external GSit plugin (this plugin's own lobby seats were removed so
# the two never fight over the same stair/slab click). This bridge only normalises GSit's
# permissions through LuckPerms: on EVERY join the player loses all GSit.* nodes and is granted
# exactly the node below, i.e. "sit by clicking a block" and nothing else (no /sit command, no
# crawling, no seat extras). Requires LuckPerms; set enabled: false to leave permissions alone.
gsit:
  enabled: true
  grant: "GSit.SitClick"

# Chat spam filter. Detections are counted persistently; once a player reaches ban-threshold
# detections they receive an escalating ChatBan (2 weeks -> 1 month -> 3 months). Kept
# conservative so a single false positive is harmless (message blocked, no ban).
spam-filter:
  enabled: true
  # A message shorter than this many characters is never treated as spam.
  min-message-length: 2
  # More than max-messages within window-seconds counts as spam.
  max-messages: 5
  window-seconds: 10
  # This many identical consecutive messages counts as spam.
  max-repeat: 3
  # Total lifetime detections before an automatic escalating ChatBan is issued.
  ban-threshold: 10

# Sign translation-key anti-cheat. Scans each sign edit's component tree for structures cheat
# clients use to probe/exploit servers (keybind components, click events, key.* probes, known
# probe keys). High-confidence structures auto-ban; ambiguous ones are only blocked + logged.
sign-guard:
  enabled: true
  auto-ban: true
  # "auto" = escalating ban (2w -> 2mo -> 3mo -> permanent), or a token like 7d / 2w / 1mo.
  auto-ban-duration: auto
  notify-player: true
  max-nest-depth: 10
  # Translatable keys under these namespaces are considered legitimate (vanilla block/item names).
  allowed-translatable-prefixes:
    - "block.minecraft."
    - "item.minecraft."
    - "entity.minecraft."
  # Exact translation keys treated as malicious mod/probe signatures (TRANSLATE-style: keys that
  # are NOT under the key.* namespace, so they need to be listed explicitly). These double as the
  # signature DB for mod fingerprinting (Item Scroller, Litematica, etc.).
  # NOTE: keys marked (verified) are confirmed; the rest are the mod's documented namespace and
  # should be verified against each mod's assets/<modid>/lang/en_us.json before relying on a ban.
  # Exact non-key.* keys verified from source. (key.* is already flagged generically below.)
  critical-keys:
    - "translation.test.invalid"                          # generic probe
    - "commands.debug.started"                            # generic probe
    - "chat.type.text"                                    # generic probe
    - "liquidbounce.module.killaura.name"                 # LiquidBounce (verified)
    - "bleachhack.module.killaura"                        # BleachHack (verified)
    - "emc.module.killaura.name"                          # Aristois (verified)
    - "coffee.module.killaura.name"                       # Coffee Client (verified)
    - "autoclicker-fabric.hud.holding"                    # AutoClicker Fabric (verified)
    - "xray.config.toggle"                                # XRay Fabric (verified)
    - "itemscroller.gui.button.config_gui.generic"       # Item Scroller (verified)
    - "text.autoconfig.accurateblockplacement.title"      # Accurate Block Placement (verified)
    - "sodium.options.buttons.donate"                    # Sodium (verified)
    - "options.iris.shaderPackSelection"                 # Iris Shaders (verified)
  # Non-key.* mod namespaces treated as malicious signatures (prefix match). Any key.* keybind /
  # translatable is already flagged generically, so this list focuses on the module-namespace probes.
  critical-key-prefixes:
    - "liquidbounce.module."   # LiquidBounce modules
    - "bleachhack.module."     # BleachHack modules
    - "emc.module."            # Aristois modules
    - "coffee.module."         # Coffee Client modules
    - "autoclicker-fabric."    # AutoClicker (Fabric)
    - "xray.config."           # XRay (Fabric)
    - "itemscroller.gui."      # Item Scroller

  # ---------------------------------------------------------------------------------------------
  # Active mod detector (DonutSMP-style, MC-265322). Requires ProtocolLib on the server.
  # How it works: a fake sign is shown to the CLIENT ONLY (no world block is ever changed),
  # loaded with mod translation keys, the sign editor is force-opened, then the fake block is
  # reverted a couple ticks later so the editor auto-closes and the client echoes back the
  # resolved text. If the returned text differs from the raw key, the mod is installed.
  # Trigger manually with /signcheck <player> (or enable check-on-join below).
  active-probe:
    enabled: false          # master switch (needs ProtocolLib)
    auto-ban: false         # false = log/notify only (recommended until verified); true = ban on hit
    auto-ban-duration: "auto"
    check-on-join: false    # silently probe every player shortly after they join
    join-delay-ticks: 60
    batch-delay-ticks: 12   # ticks between each 4-key probe sign
    revert-delay-ticks: 3   # ticks before reverting the fake sign (forces the editor to close)
    # Format: "Display Name|translation.key|MODE"  (MODE = KEYBIND or TRANSLATE, default TRANSLATE).
    #   KEYBIND  -> a {"keybind":key} component is sent; the client resolves it to its BOUND key,
    #               so it works even for mods that register only a keybind and ship no lang entry.
    #   TRANSLATE-> a {"translate":key} component is sent; the client resolves it to translated text.
    # Up to 4 keys are packed per probe sign. All keys below were verified against source
    # (CheckHacks production config / AppleModDetector / each mod's assets/<modid>/lang/en_us.json).
    #
    # Cheat / disallowed clients - these ARE eligible for auto-ban when auto-ban is true.
    cheat-signatures:
      - "Meteor Client|key.meteor-client.open-gui|TRANSLATE"
      - "LiquidBounce|liquidbounce.module.killaura.name|TRANSLATE"
      - "Freecam|key.freecam.toggle|KEYBIND"
      - "Wurst Client|key.wurst.zoom|KEYBIND"
      - "XRay (Fabric)|xray.config.toggle|KEYBIND"
      - "ChestESP|key.chestesp.toggle|KEYBIND"
      - "KillAura (Fabric)|key.killaura|KEYBIND"
      - "AutoFish|key.autofish.open_gui|KEYBIND"
      - "Lumina|key.lumina.open_click_gui|KEYBIND"
      - "AutoSwitch|key.autoswitch.toggle|KEYBIND"
      - "BleachHack|bleachhack.module.killaura|TRANSLATE"
      - "Aristois|emc.module.killaura.name|TRANSLATE"
      - "Coffee Client|coffee.module.killaura.name|TRANSLATE"
      - "World Downloader|key.wdl.startStop|TRANSLATE"
      - "AutoClicker (Fabric)|autoclicker-fabric.hud.holding|TRANSLATE"
      - "AntiAFK|key.antiafk.toggle|TRANSLATE"
      - "Auto Clicker (p1k0chu)|key.auto-clicker_.toggle|KEYBIND"
      - "AutoTotem|key.autototem.toggle|KEYBIND"
    # Utility / legitimate mods - detected & logged only; NEVER auto-banned (avoids false bans).
    utility-signatures:
      - "Item Scroller|itemscroller.gui.button.config_gui.generic|TRANSLATE"
      - "Accurate Block Placement|text.autoconfig.accurateblockplacement.title|TRANSLATE"
      - "Sodium|sodium.options.buttons.donate|TRANSLATE"
      - "Iris Shaders|options.iris.shaderPackSelection|TRANSLATE"
      - "Just Enough Items|key.jei.toggleOverlay|KEYBIND"

# AFK practice (never-ending solo duel vs the totem bot)
afk:
  # Cosmetic ancient-debris blocks scattered around the floor rim on every (re)build.
  netherite-ore-pool: 6

# Bot-vs-player practice rooms
practice:
  # Max simultaneous sessions one practice room can host. Each session runs in its own
  # disposable clone (never overlapping), so a single registered room can serve 10+
  # players training at once — the default covers the spec'd parallel bot load.
  # 0 (or negative) = unlimited.
  room-concurrency: 10
