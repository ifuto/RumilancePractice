# RumilancePractice main configuration file.
# Most values here can be reloaded at runtime with /rpadmin reload.

plugin:
  # Locale used when a player has not selected one, and as the ultimate fallback
  # when a translation key is missing from the player's own locale.
  default-locale: en_us
  # Enables verbose debug logging to the console.
  debug: false
  # When enabled, new queue/duel/FFA joins are refused with a maintenance notice.
  # Toggle at runtime with /practiceadmin maintenance <on|off>.
  maintenance: false

executor:
  # Size of the async worker pool used for I/O and heavier computations
  # (database queries, schematic pastes, statistics recalculation, etc.).
  # Must be between 1 and 4 threads; defaults to 2.
  min-threads: 1
  max-threads: 4
  core-threads: 2
  keep-alive-seconds: 60

match:
  # Countdown, in seconds, before a duel/FFA match starts.
  countdown-seconds: 5
  # Maximum match duration in seconds before a draw is forced. 0 disables the limit.
  max-duration-seconds: 0
  # Number of seconds a player has to reconnect after a disconnect before forfeiting.
  reconnect-grace-seconds: 30
  # Whether to regenerate the arena (via FAWE/WorldEdit) between matches.
  regenerate-arena: true
  # Countdown after match end before players/spectators are teleported back to the lobby.
  end-teleport-delay-seconds: 5

queue:
  # Maximum time, in seconds, a player may wait in a ranked queue before being notified.
  max-wait-notify-seconds: 60
  # Maximum ELO difference tolerated when matching players, widened over time.
  initial-elo-range: 75
  elo-range-growth-per-interval: 25
  growth-interval-seconds: 15

ranking:
  # Starting ELO rating for a kit the player has never played.
  starting-elo: 1000
  # K-factor tiers, see EloCalculator for details.
  k-factor:
    # First N ranked matches (per kit) use provisional-k.
    provisional-games: 20
    provisional-k: 64
    standard-k: 32
    # Players within the top-percent-fraction of Elo (among players with >=1 ranked match) use
    # top-percent-k instead, overriding even the provisional K-factor.
    top-percent-fraction: 0.10
    top-percent-k: 26

spectator:
  allow-flight: true
  hide-from-players: true

lobby:
  world: world
  return-to-lobby-on-death: false

fawe:
  # Whether to attempt to use FastAsyncWorldEdit/WorldEdit for arena snapshot/restore.
  enabled: true
  # Timeout, in seconds, for a single arena regeneration operation.
  operation-timeout-seconds: 30

hooks:
  placeholderapi: true

# Central Scoreboard/TAB service (see com.rumilance.practice.scoreboard). Disable if another
# plugin (e.g. TAB) should own the sidebar/tab list instead.
scoreboard:
  enabled: true
  # Central task period; the spec requires 10-20 ticks (not a per-player timer).
  update-interval-ticks: 20
  tab-header-footer: true

performance:
  # Soft cap on particles spawned per player per visual effect (region selection, arrow trails).
  particle-limit-per-player: 40
