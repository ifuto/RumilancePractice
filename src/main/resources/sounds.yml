# Sound effects. Keys use NamespacedKey form (minecraft: omitted ok).
# Set a key to "none" to make that event silent (no sound is played).
# Default pitch 0.0 for GUI sounds (client clamps). Countdown uses pitch 1.0 in code.
sounds:
  select:
    key: block.note_block.iron_xylophone
    volume: 1.0
    pitch: 0.0
  queue-leave:
    key: entity.glow_item_frame.remove_item
    volume: 1.0
    pitch: 0.0
  # Menu back is intentionally silent; gui-open clicks like a wooden button.
  gui-back:
    key: none
    volume: 1.0
    pitch: 0.0
  gui-open:
    key: block.wooden_button.click_on
    volume: 1.0
    pitch: 0.0
  kit-select:
    key: block.note_block.iron_xylophone
    volume: 1.0
    pitch: 0.0
  gui-click:
    key: block.note_block.hat
    volume: 1.0
    pitch: 0.0
  # The vanilla button click — used by the KIT SELECT GUI chip interactions and
  # /setfunc item right-click opens (user spec 2026-10-04).
  button-click:
    key: ui.button.click
    volume: 1.0
    pitch: 1.0
  duel-request-received:
    key: block.note_block.bell
    volume: 1.0
    pitch: 0.0
  duel-request-sent:
    key: block.note_block.pling
    volume: 1.0
    pitch: 0.0
  queue-joined:
    key: block.anvil.place
    volume: 1.0
    pitch: 0.0
  cancel:
    key: entity.item.pickup
    volume: 1.0
    pitch: 0.0
  delete:
    key: entity.item.break
    volume: 1.0
    pitch: 0.0
  match-found:
    key: entity.player.levelup
    volume: 1.0
    pitch: 1.0
  death:
    key: entity.lightning_bolt.impact
    volume: 1.0
    pitch: 1.0
  match-start:
    key: item.mace.smash_ground_heavy
    volume: 1.0
    pitch: 1.0
  match-end-anvil:
    key: block.anvil.land
    volume: 1.0
    pitch: 1.0
  match-end-levelup:
    key: entity.player.levelup
    volume: 1.0
    pitch: 1.0
  match-countdown-tick:
    key: block.note_block.hat
    volume: 1.0
    pitch: 1.0
  ready:
    key: block.anvil.land
    volume: 1.0
    pitch: 1.0
  ffa-reset-warn:
    key: block.note_block.hat
    volume: 0.4
    pitch: 1.4
  ffa-open:
    key: entity.player.levelup
    volume: 1.0
    pitch: 1.0
  error:
    key: block.note_block.bass
    volume: 1.0
    pitch: 0.5
  save-done:
    key: entity.player.levelup
    volume: 1.0
    pitch: 1.2
  tell-received:
    key: block.amethyst_block.chime
    volume: 0.5
    pitch: 1.5
  kit-reload:
    key: entity.player.levelup
    volume: 0.9
    pitch: 1.1
