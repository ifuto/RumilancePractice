# Sound effects. Keys use NamespacedKey form (minecraft: omitted ok).
# Set a key to "none" to make that event silent (no sound is played).
# Default pitch 0.0 for GUI sounds (client clamps). Countdown uses pitch 1.0 in code.
sounds:
  select:
    key: block.note_block.xylophone
    volume: 1.0
    pitch: 0.0
  queue-leave:
    key: entity.glow_item_frame.remove_item
    volume: 1.0
    pitch: 0.0
  # Menu open and back are intentionally silent.
  gui-back:
    key: none
    volume: 1.0
    pitch: 0.0
  gui-open:
    key: none
    volume: 1.0
    pitch: 1.4
  kit-select:
    key: entity.experience_orb.pickup
    volume: 1.0
    pitch: 0.0
  gui-click:
    key: block.note_block.hat
    volume: 1.0
    pitch: 0.0
  duel-request-received:
    key: block.note_block.bell
    volume: 1.0
    pitch: 0.0
  duel-request-sent:
    key: block.note_block.chime
    volume: 1.0
    pitch: 0.0
  queue-joined:
    key: block.anvil.place
    volume: 1.0
    pitch: 0.0
  cancel:
    key: entity.item.pickup
    volume: 1.0
    pitch: 0.0
  delete:
    key: entity.item.break
    volume: 1.0
    pitch: 0.0
  match-found:
    key: entity.player.levelup
    volume: 1.0
    pitch: 1.0
  death:
    key: entity.lightning_bolt.impact
    volume: 1.0
    pitch: 1.0
  match-start:
    key: item.mace.smash_ground_heavy
    volume: 1.0
    pitch: 1.0
  match-end-anvil:
    key: block.anvil.land
    volume: 1.0
    pitch: 1.0
  match-end-levelup:
    key: entity.player.levelup
    volume: 1.0
    pitch: 1.0
  match-countdown-tick:
    key: block.note_block.hat
    volume: 1.0
    pitch: 1.0
  error:
    key: block.note_block.bass
    volume: 1.0
    pitch: 0.5
