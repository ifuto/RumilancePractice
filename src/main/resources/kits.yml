# Default kit definitions. Additional kits can be created in-game with /kit create.
# Item entries use Bukkit Material names; enchantments/nbt beyond the basics are
# configured through the in-game kit editor and persisted via ItemSerializer.
kits:
  nodebuff:
    display-name: "<gray>NoDebuff"
    icon: IRON_SWORD
    ranked: true
    ffa-enabled: true
    max-health: 20.0
    natural-health-regen: true
    items:
      - slot: 0
        material: IRON_SWORD
      - slot: 1
        material: BOW
      - slot: 8
        material: ARROW
        amount: 64
    armor:
      helmet: null
      chestplate: null
      leggings: null
      boots: null

  boxing:
    display-name: "<yellow>Boxing"
    icon: LEATHER_HELMET
    ranked: true
    ffa-enabled: true
    max-health: 20.0
    natural-health-regen: true
    items: []
    armor:
      helmet: LEATHER_HELMET
      chestplate: LEATHER_CHESTPLATE
      leggings: LEATHER_LEGGINGS
      boots: LEATHER_BOOTS

  sumo:
