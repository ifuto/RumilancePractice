# build-mod.yml — クライアントMod「KB Probe」(kb-probe/) の Fabric(Loom) ビルド正本。
#
# [このファイルの役割]
# `.github/workflows/build-mod.yml` へ **人手で貼る正本**。サンドボックスのエージェントは
# GitHub App の workflows 権限を持たないため `.github/workflows/**` を push できない。
# java-env.yml と同じ運用: ここを全文コピーし GitHub のワークフロー編集画面へコミット。
#
# [設計]
#   発火: kb-probe/** への push、または手動。
#   起動: actions/setup-java@v5 (Temurin 21) → repo-root の gradlew で `gradle -p kb-probe build`
#        （kb-probe は root wrapper を借りる standalone プロジェクト: settings.gradle 冒頭参照）。
#   成果: mod-jars アーティファクトに kb-probe-<version>.jar、失敗時は mod-build-log を解析。
#
# [なぜプラグインの build.yml に統合しないか]
# build.yml は paperweight 依存解決込みのサーバープラグイン向け。kb-probe は Loom/別
# スプリントとの混同を避けるため、かつ既に `ci/java-env.sh` でも常駐検証している
# （相当の手抜き防止: 二重検証。後者は rc 評価付き + `::error::` excerpt 入り）。
# アーティファクト以下に設定済みのシェルデフォルトで `tee` による rc 隠蔽は起こらない
# （`set -o pipefail`）。

name: build-mod

on:
  push:
    paths:
      - "kb-probe/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: chmod gradlew (repo-root wrapper, borrowed by kb-probe)
        run: chmod +x gradlew

      - name: Build mod (kb-probe, Gradle -p bridge)
        run: |
          set -o pipefail
          ./gradlew -p kb-probe build --no-daemon --stacktrace 2>&1 | tee /tmp/mod-build.log

      - name: Upload mod jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: kb-probe/build/libs/kb-probe-*.jar
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-build-log
          path: /tmp/mod-build.log
          if-no-files-found: ignore
