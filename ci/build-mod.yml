# build-mod.yml — 連携Mod（mod/ ディレクトリ）のGradleビルド。
# .github/workflows/ に build.yml と並べて置くだけで有効化。
# 発火: mod/** を含むPush、または手動 (Actions → build-mod → Run workflow)。
# 出力: 成功時に mod-jars アーティファクト (mod/build/libs/*.jar)。
# ※ gradle wrapperのjarをリポジトリに含めないため、setup-gradleがGradle本体を導入します
#    （前版の ./gradlew 版からの差分はそこだけです。差し替えをお願いします）。

name: build-mod

on:
  push:
    paths:
      - "mod/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build mod
        run: |
          (cd mod && gradle build --no-daemon --stacktrace) 2>&1 | tee /tmp/mod-build.log

      - name: Upload mod jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: mod/build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-build-log
          path: /tmp/mod-build.log
          if-no-files-found: ignore
