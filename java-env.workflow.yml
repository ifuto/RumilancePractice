# java-env — サンドボックス向け配送ワークフロー(薄いディスパッチャ)。
#
# [このファイルの役割]
# 実処理は全部リポジトリ内の ci/java-env.sh にある。ここはそれを呼ぶだけ:
#   ci/java-env.sh が JDK 21 (Temurin) と Paper 1.21.11 を取得 → java-env-delivery ブランチへ、
#   続けて起動検証済み Fabric 実測サーバー(Fabric + fabric-api + HeroBot MOD + Quantum マップ +
#   qlog データパック)を組み立て → mc-server-delivery ブランチへ配送する。
#
# [なぜ薄くするのか]
# サンドボックスのエージェントは .github/workflows/** を push できない
# (GitHub App に workflows 権限が無く "refusing to allow a GitHub App to create or update
#  workflow ... without workflows permission" で拒否される)。ロジックを ci/ に置けば、
# 私が **再貼り付けなしで** 修正・再実行できる。このファイル自体を変える時だけ人手が要る。
#
# [発火] java-trigger.md を含む push、または手動(Actions → java-env → Run workflow)。
#
# [成果物] artifact「java-env」(/tmp/bundle/*)は人間用。サンドボックスは Azure blob を
# 読めない(EOF 遮断)ので、そちらへは git ブランチで渡す:
#   mc-server-delivery  ← mcserver.tar.gz(90MB 分割・起動検証ログ同梱)
#   java-env-delivery   ← jdk21.tar.gz(90MB 分割) + paper-1.21.11-*.jar

name: java-env

on:
  push:
    paths:
      - 'java-trigger.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: java-env
  cancel-in-progress: false

jobs:
  java-env:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (persist-credentials が配送 push の資格情報になる)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: ci/java-env.sh — 取得 → 起動検証 → git 配送
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::java-env failed at line $LINENO doing: ${BASH_COMMAND}"' ERR
          bash ci/java-env.sh

      - name: Upload artifact (人間用フォールバック — サンドボックスは artifact を読めない)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-env
          path: /tmp/bundle/*
          retention-days: 30
          if-no-files-found: ignore
