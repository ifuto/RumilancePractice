plugins {
    id "java"
    // 1.7-SNAPSHOT (進化するスナップショット) は内部で Gradle 9.x の Problems API を要求する
    // までに前進しており互換切れ。リリース版 1.14.7 (Gradle 9.2+ 対応, root wrapper
    // 9.6.1 と整合: deserialization は yarn (obf) で classic 動作) に固定する。
    id "fabric-loom" version "1.14.7"
}

group = "com.rumilance"
version = "0.5.0"

base {
    archivesName = "kb-probe"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Fabric 公式テンプレート準拠: Minecraft は UTF-8 のソースを期待する
    withSourcesJar()
}

loom {
    // クライアント専用 Mod。runClient 構成は loom の既定で十分。
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 0.5.0 で GUI(キーバインド) を追加するため fabric-api を採用（もともとサーバー側配布
    // 環境には必須導入済み。KeyBinding の登録に必要）。
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
