plugins {
    id "java"
    // loom はリリース版をピン — 1.7-SNAPSHOT は Gradle 9 のみの Problems.forNamespace を要
    // 求するまで前進（CI 実証 2026-10-01）、1.14.7 もソースが N/A 解像で yarn の
    // EntityVelocityUpdateS2CPacket 型が激変（double 化）して foul mismatch を起こした。
    // 0.x 当時に安定動作した軸 = loom 1.7.4 (Gradle 8.8+ 向けリリース) に固定する。
    id "fabric-loom" version "1.14.7"
}

group = "com.rumilance"
version = "0.5.0"

base {
    archivesName = "kb-probe"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Fabric 公式テンプレート準拠: Minecraft は UTF-8 のソースを期待する
    withSourcesJar()
}

loom {
    // クライアント専用 Mod。runClient 構成は loom の既定で十分。
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 0.5.0 で GUI(キーバインド) を追加するため fabric-api を採用（もともとサーバー側配布
    // 環境には必須導入済み。KeyBinding の登録に必要）。
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
