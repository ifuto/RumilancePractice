plugins {
    id "java"
    // 1.21.11 対応: fabric-loom-remap 1.18-SNAPSHOT (obfuscated 版は remap が必要)
    id "net.fabricmc.fabric-loom-remap" version "1.18-SNAPSHOT"
}

group = "com.rumilance"
version = "0.5.0"

base {
    archivesName = "kb-probe"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Fabric 公式テンプレート準拠: Minecraft は UTF-8 のソースを期待する
    withSourcesJar()
}

loom {
    // クライアント専用 Mod。runClient 構成は loom の既定で十分。
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 0.5.0 で GUI(キーバインド) を追加するため fabric-api を採用（もともとサーバー側配布
    // 環境には必須導入済み。KeyBinding の登録に必要）。
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
