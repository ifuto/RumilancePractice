# kb-probe 専用 wrapper: 当初 root wrapper 流用設計だったが、`gradle -p` の曖昧性を
# 避けるため独立 wrapper とした。fabric-loom 1.14.7 は Gradle 9.2+ 対応、
# root wrapper と同一の Gradle 9.6.1 を pin する（2026-10-01: loom 1.7-SNAPSHOT が
#  Gradle 9 のみの Problems.forNamespace を要求するまで前進しているのに対処、
#  loom も SNAPSHOT ではなくリリース版 1.14.7 に固定 — CI で実証済み）。
# 配布 jar は root の boot ラッパー（version 差は distributionUrl へのポインタだけ）。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
