# kb-probe 専用 wrapper: fabric-loom 1.7-SNAPSHOT は Gradle 9 で除去された Problems API
# (org.gradle.api.problems.Problems.forNamespace(String)) を使うため、root wrapper
# (Gradle 9.x) とは切り離して Gradle 8.13 に固定する。配布 jar は root から複製された
# 同一ブートラッパー (version 差はこの distributionUrl へのポインタだけ)。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
